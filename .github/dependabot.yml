version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # React changes the entry bundle, so it is reviewed apart from routine updates.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Node.js types follow the runtime declared in package.json engines and the workflows.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # typescript-eslint supports TypeScript below 6.1.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # jsdom 30 requires a newer Node.js 22 release than package.json engines declares.
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
      # pnpm-workspace.yaml patches this exact version; port the patch before upgrading.
      - dependency-name: "@meting/core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

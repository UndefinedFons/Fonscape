name: Restore abuse.js EOF newline

on:
  push:
    branches:
      - chore/restore-abuse-eof-newline
    paths:
      - .github/workflows/restore-abuse-eof-newline.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore newline and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('functions/_lib/abuse.js')
          data = path.read_bytes()
          if not data.endswith(b'\n'):
              path.write_bytes(data + b'\n')
          PY
          rm .github/workflows/restore-abuse-eof-newline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/abuse.js .github/workflows/restore-abuse-eof-newline.yml
          git commit -m "chore: restore trailing newline"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: refresh dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Restore responsive image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            public/fonscape/generated-images/
            .fonscape-cache/responsive-images/
          fail-on-cache-miss: false
          key: fonscape-responsive-images-v1-${{ runner.os }}-${{ runner.arch }}-node22-pnpm11.16.0-${{ hashFiles('scripts/generate-responsive-images.mjs', 'scripts/generate-content-targets.mjs', 'scripts/generate-font-css.mjs', 'src/content/frontmatter.js', 'src/content/markdown.js', 'src/pages/homeContent.js', 'src/siteConfig.js', 'src/responsiveImages.ts', 'package.json', 'pnpm-lock.yaml') }}-${{ hashFiles('public/assets/**/*', 'fonscape.config.js', 'src/content/**/*') }}
          restore-keys: |
            fonscape-responsive-images-v1-${{ runner.os }}-${{ runner.arch }}-node22-pnpm11.16.0-${{ hashFiles('scripts/generate-responsive-images.mjs', 'scripts/generate-content-targets.mjs', 'scripts/generate-font-css.mjs', 'src/content/frontmatter.js', 'src/content/markdown.js', 'src/pages/homeContent.js', 'src/siteConfig.js', 'src/responsiveImages.ts', 'package.json', 'pnpm-lock.yaml') }}-

      - name: Test and build
        run: pnpm check

      - name: Validate Cloudflare Worker bundle
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/worker-dry-run

      - name: Audit production dependencies
        run: pnpm audit --prod

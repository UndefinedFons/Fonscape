name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore responsive image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            public/fonscape/generated-images/
            .fonscape-cache/responsive-images/
          fail-on-cache-miss: false
          key: fonscape-responsive-images-v1-${{ runner.os }}-${{ runner.arch }}-node22-pnpm11.16.0-${{ hashFiles('scripts/generate-responsive-images.ts', 'scripts/generate-content-targets.ts', 'scripts/generate-font-css.ts', 'src/content/frontmatter.ts', 'src/content/markdown.ts', 'src/pages/homeContent.ts', 'src/siteConfig.ts', 'src/responsiveImages.ts', 'package.json', 'pnpm-lock.yaml') }}-${{ hashFiles('public/assets/**/*', 'fonscape.config.js', 'src/content/**/*') }}
          restore-keys: |
            fonscape-responsive-images-v1-${{ runner.os }}-${{ runner.arch }}-node22-pnpm11.16.0-${{ hashFiles('scripts/generate-responsive-images.ts', 'scripts/generate-content-targets.ts', 'scripts/generate-font-css.ts', 'src/content/frontmatter.ts', 'src/content/markdown.ts', 'src/pages/homeContent.ts', 'src/siteConfig.ts', 'src/responsiveImages.ts', 'package.json', 'pnpm-lock.yaml') }}-

      - name: Test and build
        run: pnpm check

      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main'
        run: pnpm db:migrate:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload branch preview to Cloudflare Workers
        if: github.ref != 'refs/heads/main'
        run: pnpm exec wrangler versions upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
